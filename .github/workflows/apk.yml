name: APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renombrar
        run: cp android/app/build/outputs/apk/release/app-release.apk GSI-ALERTA.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GSI-ALERTA.apk
          path: GSI-ALERTA.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: GSI-ALERTA ${{ github.run_number }}
          files: GSI-ALERTA.apk
          make_latest: true
